# Direction_Vol_C90 Parameters (Daily timeframe)

cells = 63
epochs = 80
lr = 0.003
seq = 10
mode = direction
output = 3
wd = 0.0001
patience = 12
data = ../resources/EURUSD_Daily_200301010000_202611160000.csv
sdata = ../resources/GBPUSD_Daily_200301010000_202611160000.csv
model =
batch_size = 16
momentum = 0.9
seed = 42
clip_min = -5.0
clip_max = 5.0
train_ratio = 0.8
volume_return_clip = 10.0
forget_gate_bias_init = 1.0
prediction_threshold = 0.5

# --- Walk-forward ---
wf_train_months = 24
wf_test_months = 3
wf_shift = 3

# --- Volatility ---
vol_mode = garch
ewma_lambda = 0.94

# --- Backtest costs (direct fraction, e.g. 0.0001 = 1bp) ---
cost_spread = 0.0001
cost_commission = 0.0

# --- Dynamic threshold (0.0 = disabled, >0 = vol regime gate) ---
threshold_k = 2.0

# --- Validation split ---
val_ratio = 0.15
